<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>BiblioTrack — Gestor de Lecturas y Sagas</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Google Identity Services & Google API -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      overflow-x: hidden;
    }

    /* Ocultar barra de desplazamiento en filtros horizontales móviles */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Transiciones suaves para tarjetas y progreso */
    .progress-bar-fill {
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.45s ease;
    }

    .saga-chevron {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .saga-chevron.rotated {
      transform: rotate(180deg);
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-card {
      animation: fadeSlideUp 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500/30 selection:text-indigo-200 overflow-x-hidden">

  <!-- Toast / Notificación flotante (sin alert()) -->
  <div id="toastContainer" class="fixed bottom-4 right-4 left-4 sm:left-auto sm:max-w-sm z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Header Sticky Responsivo -->
  <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
        
        <!-- Fila superior en móvil: Logo + Botón Agregar -->
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 shrink-0">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
              </svg>
            </div>
            <div class="min-w-0">
              <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-white truncate">BiblioTrack</h1>
              <p class="text-[11px] sm:text-xs text-slate-400 truncate">Sagas, Libros, Cómics y Mangas</p>
            </div>
          </div>

          <!-- Acción primaria rápida en móvil -->
          <button onclick="openBookModal()" class="lg:hidden inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 min-h-[42px] rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white text-xs sm:text-sm font-semibold shadow-md shadow-indigo-600/25 transition shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            <span>Nueva Lectura</span>
          </button>
        </div>

        <!-- Controles de Google Sheets + Lectura del Día + Nueva Lectura (Desktop) -->
        <div class="flex flex-wrap items-center gap-2 sm:gap-2.5">
          <!-- Estado de conexión Google Sheets -->
          <div id="authSection" class="flex items-center gap-2 flex-wrap">
            <button id="btnGoogleSignIn" onclick="handleAuthClick()" class="inline-flex items-center gap-2 px-3 py-2 min-h-[40px] rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium transition">
              <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
              </svg>
              <span>Conectar Google Sheets</span>
            </button>
          </div>

          <!-- Pill de usuario conectado (oculto por defecto) -->
          <div id="connectedBar" class="hidden items-center gap-1.5 sm:gap-2 flex-wrap">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-1.5 min-h-[38px] rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs max-w-[190px] sm:max-w-[230px]">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
              <span id="userEmailLabel" class="truncate font-medium">Conectado</span>
            </div>

            <button id="btnSyncNow" onclick="syncWithGoogleSheets(true)" title="Sincronizar ahora" class="inline-flex items-center justify-center gap-1.5 px-3 py-2 min-h-[40px] rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium transition">
              <svg id="syncIcon" class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
              </svg>
              <span class="hidden sm:inline">Sincronizar</span>
            </button>

            <button onclick="handleSignoutClick()" title="Cerrar sesión" class="inline-flex items-center justify-center px-2.5 py-2 min-h-[40px] rounded-xl bg-slate-900 hover:bg-rose-950/60 border border-slate-800 hover:border-rose-800/60 text-slate-400 hover:text-rose-300 text-xs transition">
              Salir
            </button>
          </div>

          <!-- Botón Lectura del Día -->
          <button onclick="pickDailyRead()" class="inline-flex items-center justify-center gap-1.5 px-3 py-2 min-h-[40px] rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/40 text-amber-300 text-xs font-semibold transition">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
            </svg>
            <span>Lectura del Día</span>
          </button>

          <!-- Botón Nueva Lectura (Desktop) -->
          <button onclick="openBookModal()" class="hidden lg:inline-flex items-center justify-center gap-1.5 px-4 py-2 min-h-[40px] rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white text-xs font-semibold shadow-md shadow-indigo-600/25 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            <span>Nueva Lectura</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-6 space-y-5">

    <!-- Tarjetas de Resumen Rápido -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-4">
      <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-3 sm:p-4">
        <p class="text-[11px] sm:text-xs font-medium text-slate-400">Total Obras</p>
        <p id="statTotal" class="text-xl sm:text-2xl font-extrabold text-white mt-0.5">0</p>
      </div>
      <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-3 sm:p-4">
        <p class="text-[11px] sm:text-xs font-medium text-slate-400">Sagas / Series</p>
        <p id="statSagas" class="text-xl sm:text-2xl font-extrabold text-indigo-400 mt-0.5">0</p>
      </div>
      <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-3 sm:p-4">
        <p class="text-[11px] sm:text-xs font-medium text-slate-400">En Progreso</p>
        <p id="statInProgress" class="text-xl sm:text-2xl font-extrabold text-amber-400 mt-0.5">0</p>
      </div>
      <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-3 sm:p-4">
        <p class="text-[11px] sm:text-xs font-medium text-slate-400">Completados</p>
        <p id="statCompleted" class="text-xl sm:text-2xl font-extrabold text-emerald-400 mt-0.5">0</p>
      </div>
    </section>

    <!-- Barra de Búsqueda, Selector de Vista (Sagas vs Individual) y Filtros Deslizables -->
    <section class="space-y-3">
      <div class="flex flex-col sm:flex-row gap-2.5 sm:items-center sm:justify-between">
        <!-- Buscador -->
        <div class="relative flex-1">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
          <input
            id="searchInput"
            type="text"
            oninput="renderLibrary()"
            placeholder="Buscar por título, saga o autor..."
            class="w-full pl-10 pr-4 py-2.5 min-h-[42px] rounded-xl bg-slate-900 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm text-slate-100 placeholder-slate-500 outline-none transition"
          />
        </div>

        <!-- Selector de Modo de Vista: Agrupado por Sagas vs Vista Individual -->
        <div class="inline-flex p-1 rounded-xl bg-slate-900 border border-slate-800 self-start sm:self-auto w-full sm:w-auto">
          <button
            id="btnViewGrouped"
            onclick="setViewMode('grouped')"
            class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3 py-2 min-h-[36px] rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow-sm"
          >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 7.125C2.25 6.504 2.754 6 3.375 6h6c.621 0 1.125.504 1.125 1.125v3.75c0 .621-.504 1.125-1.125 1.125h-6a1.125 1.125 0 01-1.125-1.125v-3.75zM14.25 8.625c0-.621.504-1.125 1.125-1.125h5.25c.621 0 1.125.504 1.125 1.125v8.25c0 .621-.504 1.125-1.125 1.125h-5.25a1.125 1.125 0 01-1.125-1.125v-8.25zM3.75 16.125c0-.621.504-1.125 1.125-1.125h5.25c.621 0 1.125.504 1.125 1.125v2.25c0 .621-.504 1.125-1.125 1.125h-5.25a1.125 1.125 0 01-1.125-1.125v-2.25z" />
            </svg>
            <span>Agrupado por Sagas</span>
          </button>
          <button
            id="btnViewIndividual"
            onclick="setViewMode('individual')"
            class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3 py-2 min-h-[36px] rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200"
          >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
            </svg>
            <span>Vista Individual</span>
          </button>
        </div>
      </div>

      <!-- Filtros horizontales deslizables (mobile-friendly) -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 -mx-3 px-3 sm:mx-0 sm:px-0">
        <button onclick="setFilter('all')" data-filter="all" class="filter-pill shrink-0 px-3.5 py-2 min-h-[38px] rounded-xl text-xs font-semibold bg-indigo-600 text-white transition">
          Todos
        </button>
        <button onclick="setFilter('Libro')" data-filter="Libro" class="filter-pill shrink-0 px-3.5 py-2 min-h-[38px] rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">
          📚 Libros
        </button>
        <button onclick="setFilter('Cómic')" data-filter="Cómic" class="filter-pill shrink-0 px-3.5 py-2 min-h-[38px] rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">
          💥 Cómics
        </button>
        <button onclick="setFilter('Manga')" data-filter="Manga" class="filter-pill shrink-0 px-3.5 py-2 min-h-[38px] rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">
          ⛩️ Mangas
        </button>
        <button onclick="setFilter('in_progress')" data-filter="in_progress" class="filter-pill shrink-0 px-3.5 py-2 min-h-[38px] rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">
          ⏳ En progreso
        </button>
        <button onclick="setFilter('completed')" data-filter="completed" class="filter-pill shrink-0 px-3.5 py-2 min-h-[38px] rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">
          ✅ Completados
        </button>
      </div>
    </section>

    <!-- Contenedor Principal de Sagas y Lecturas -->
    <section id="libraryContainer" class="space-y-6">
      <!-- Renderizado dinámicamente vía JS -->
    </section>

  </main>

  <!-- Modal para Agregar / Editar Lectura -->
  <div id="bookModal" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm p-3 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="sticky top-0 z-10 flex items-center justify-between px-4 sm:px-6 py-4 bg-slate-900/95 backdrop-blur border-b border-slate-800">
        <h2 id="modalTitle" class="text-base sm:text-lg font-bold text-white">Nueva Lectura</h2>
        <button onclick="closeBookModal()" class="p-2 min-h-[40px] min-w-[40px] flex items-center justify-center rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="bookForm" onsubmit="saveBook(event)" class="p-4 sm:p-6 space-y-4">
        <input type="hidden" id="bookId" />

        <!-- Título -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Título de la obra *</label>
          <input id="bookTitle" type="text" required placeholder="Ej. El Imperio Final" class="w-full px-3.5 py-2.5 min-h-[42px] rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 text-sm text-white outline-none" />
        </div>

        <!-- Tipo y Autor -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Formato *</label>
            <select id="bookType" onchange="updateUnitLabels()" class="w-full px-3.5 py-2.5 min-h-[42px] rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 text-sm text-white outline-none">
              <option value="Libro">📚 Libro (Páginas)</option>
              <option value="Cómic">💥 Cómic (Páginas)</option>
              <option value="Manga">⛩️ Manga (Capítulos)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Autor / Mangaka</label>
            <input id="bookAuthor" type="text" placeholder="Ej. Brandon Sanderson" class="w-full px-3.5 py-2.5 min-h-[42px] rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 text-sm text-white outline-none" />
          </div>
        </div>

        <!-- Progreso Actual y Total -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label id="labelCurrentUnit" class="block text-xs font-semibold text-slate-300 mb-1.5">Páginas leídas</label>
            <input id="bookCurrent" type="number" min="0" value="0" required class="w-full px-3.5 py-2.5 min-h-[42px] rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 text-sm text-white outline-none" />
          </div>
          <div>
            <label id="labelTotalUnit" class="block text-xs font-semibold text-slate-300 mb-1.5">Total de páginas *</label>
            <input id="bookTotal" type="number" min="1" value="100" required class="w-full px-3.5 py-2.5 min-h-[42px] rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 text-sm text-white outline-none" />
          </div>
        </div>

        <!-- Sección de Saga / Serie -->
        <div class="p-3.5 rounded-xl bg-slate-950/80 border border-slate-800/90 space-y-3">
          <label class="flex items-center gap-3 cursor-pointer select-none min-h-[36px]">
            <input id="bookIsSaga" type="checkbox" onchange="toggleSagaFields()" class="w-4 h-4 rounded text-indigo-600 bg-slate-900 border-slate-700 focus:ring-indigo-500" />
            <span class="text-xs sm:text-sm font-semibold text-slate-200">Pertenece a una Saga o Serie</span>
          </label>

          <div id="sagaFieldsContainer" class="hidden grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-slate-400 mb-1">Nombre de la Saga *</label>
              <input id="bookSagaName" list="existingSagasList" type="text" placeholder="Ej. Nacidos de la Bruma" class="w-full px-3 py-2.5 min-h-[42px] rounded-xl bg-slate-900 border border-slate-800 focus:border-indigo-500 text-sm text-white outline-none" />
              <datalist id="existingSagasList"></datalist>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Orden / Tomo #</label>
              <input id="bookSagaOrder" type="number" min="1" value="1" class="w-full px-3 py-2.5 min-h-[42px] rounded-xl bg-slate-900 border border-slate-800 focus:border-indigo-500 text-sm text-white outline-none" />
            </div>
          </div>
        </div>

        <!-- URL de Portada -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">URL de Portada (opcional)</label>
          <input id="bookCover" type="url" placeholder="https://ejemplo.com/portada.jpg" class="w-full px-3.5 py-2.5 min-h-[42px] rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 text-sm text-white outline-none" />
        </div>

        <!-- Botones del Formulario -->
        <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-800">

  <script>
    // =========================================================================
    // CONFIGURACIÓN DE GOOGLE OAUTH 2.0 Y GOOGLE SHEETS API
    // =========================================================================
    const GOOGLE_CLIENT_ID = '453664187536-f4t5e02odju4f32mhe8ji0gsamad5sq6.apps.googleusercontent.com';
    const DISCOVERY_DOCS = [
      'https://sheets.googleapis.com/$discovery/rest?version=v4',
      'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'
    ];
    const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
    const SPREADSHEET_TITLE = 'BiblioTrack_DB';
    const SHEET_NAME = 'Lecturas';
    const STORAGE_KEY = 'bibliotrack_books_v2';
    const EXPANDED_SAGAS_KEY = 'bibliotrack_expanded_sagas';

    let tokenClient = null;
    let gapiInited = false;
    let gisInited = false;
    let accessToken = null;
    let spreadsheetId = null;

    // Estado de la aplicación
    let books = [];
    let currentFilter = 'all';
    let viewMode = 'grouped'; // 'grouped' | 'individual'
    let expandedSagas = new Set();
    let bookIdToDelete = null;

    // =========================================================================
    // INICIALIZACIÓN Y DATOS DE EJEMPLO
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalData();
      renderLibrary();
      initGoogleScripts();
    });

    function loadLocalData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          books = JSON.parse(saved);
        } else {
          // Datos iniciales de demostración con sagas y obras independientes
          books = [
            {
              id: 'demo-1',
              title: 'El Imperio Final',
              type: 'Libro',
              author: 'Brandon Sanderson',
              current: 688,
              total: 688,
              isSaga: true,
              sagaName: 'Nacidos de la Bruma',
              sagaOrder: 1,
              cover: ''
            },
            {
              id: 'demo-2',
              title: 'El Pozo de la Ascensión',
              type: 'Libro',
              author: 'Brandon Sanderson',
              current: 310,
              total: 800,
              isSaga: true,
              sagaName: 'Nacidos de la Bruma',
              sagaOrder: 2,
              cover: ''
            },
            {
              id: 'demo-3',
              title: 'El Héroe de las Eras',
              type: 'Libro',
              author: 'Brandon Sanderson',
              current: 0,
              total: 760,
              isSaga: true,
              sagaName: 'Nacidos de la Bruma',
              sagaOrder: 3,
              cover: ''
            },
            {
              id: 'demo-4',
              title: 'Chainsaw Man Vol. 1',
              type: 'Manga',
              author: 'Tatsuki Fujimoto',
              current: 7,
              total: 7,
              isSaga: true,
              sagaName: 'Chainsaw Man',
              sagaOrder: 1,
              cover: ''
            },
            {
              id: 'demo-5',
              title: 'Chainsaw Man Vol. 2',
              type: 'Manga',
              author: 'Tatsuki Fujimoto',
              current: 4,
              total: 9,
              isSaga: true,
              sagaName: 'Chainsaw Man',
              sagaOrder: 2,
              cover: ''
            },
            {
              id: 'demo-6',
              title: 'Proyecto Hail Mary',
              type: 'Libro',
              author: 'Andy Weir',
              current: 195,
              total: 528,
              isSaga: false,
              sagaName: '',
              sagaOrder: 1,
              cover: ''
            }
          ];
          saveLocalData();
        }

        const savedExpanded = localStorage.getItem(EXPANDED_SAGAS_KEY);
        if (savedExpanded) {
          expandedSagas = new Set(JSON.parse(savedExpanded));
        }
      } catch (e) {
        console.error('Error cargando localStorage:', e);
        books = [];
      }
    }

    function saveLocalData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
        localStorage.setItem(EXPANDED_SAGAS_KEY, JSON.stringify([...expandedSagas]));
      } catch (e) {
        console.error('Error guardando localStorage:', e);
      }
    }

    // =========================================================================
    // GOOGLE IDENTITY SERVICES Y SHEETS SYNC
    // =========================================================================
    function initGoogleScripts() {
      const checkInterval = setInterval(() => {
        if (typeof gapi !== 'undefined' && !gapiInited) {
          gapi.load('client', async () => {
            try {
              await gapi.client.init({ discoveryDocs: DISCOVERY_DOCS });
              gapiInited = true;
            } catch (err) {
              console.error('Error inicializando gapi.client:', err);
            }
          });
        }

        if (typeof google !== 'undefined' && google.accounts && !gisInited) {
          try {
            tokenClient = google.accounts.oauth2.initTokenClient({
              client_id: GOOGLE_CLIENT_ID,
              scope: SCOPES,
              callback: async (tokenResponse) => {
                if (tokenResponse && tokenResponse.access_token) {
                  accessToken = tokenResponse.access_token;
                  gapi.client.setToken({ access_token: accessToken });
                  await onGoogleConnected();
                }
              },
            });
            gisInited = true;
          } catch (err) {
            console.error('Error inicializando GIS:', err);
          }
        }

        if (gapiInited && gisInited) {
          clearInterval(checkInterval);
        }
      }, 300);
    }

    function handleAuthClick() {
      if (!tokenClient) {
        showToast('Cargando servicios de Google, intenta en un segundo...', 'info');
        return;
      }
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    function handleSignoutClick() {
      if (accessToken && typeof google !== 'undefined') {
        google.accounts.oauth2.revoke(accessToken, () => {});
      }
      accessToken = null;
      spreadsheetId = null;
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('connectedBar').classList.add('hidden');
      document.getElementById('connectedBar').classList.remove('flex');
      showToast('Sesión de Google cerrada', 'info');
    }

    async function onGoogleConnected() {
      document.getElementById('authSection').classList.add('hidden');
      const connectedBar = document.getElementById('connectedBar');
      connectedBar.classList.remove('hidden');
      connectedBar.classList.add('flex');

      try {
        const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (res.ok) {
          const profile = await res.json();
          document.getElementById('userEmailLabel').textContent = profile.email || 'Conectado';
        }
      } catch (e) {
        console.warn('No se pudo obtener el perfil:', e);
      }

      await syncWithGoogleSheets(true);
    }

    async function findOrCreateSpreadsheet() {
      if (spreadsheetId) return spreadsheetId;

      const query = `name='${SPREADSHEET_TITLE}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`;
      const searchRes = await gapi.client.drive.files.list({
        q: query,
        fields: 'files(id, name)',
        spaces: 'drive'
      });

      const files = searchRes.result.files;
      if (files && files.length > 0) {
        spreadsheetId = files[0].id;
        return spreadsheetId;
      }

      const createRes = await gapi.client.sheets.spreadsheets.create({
        resource: {
          properties: { title: SPREADSHEET_TITLE },
          sheets: [{ properties: { title: SHEET_NAME } }]
        }
      });

      spreadsheetId = createRes.result.spreadsheetId;

      // Escribir encabezados iniciales
      await gapi.client.sheets.spreadsheets.values.update({
        spreadsheetId,
        range: `${SHEET_NAME}!A1:J1`,
        valueInputOption: 'RAW',
        resource: {
          values: [[
            'id', 'title', 'type', 'author', 'current', 'total', 'isSaga', 'sagaName', 'sagaOrder', 'cover'
          ]]
        }
      });

      return spreadsheetId;
    }

    async function syncWithGoogleSheets(pullFirst = false) {
      if (!accessToken) return;
      const syncIcon = document.getElementById('syncIcon');
      syncIcon.classList.add('animate-spin');

      try {
        const sheetId = await findOrCreateSpreadsheet();

        if (pullFirst) {
          const getRes = await gapi.client.sheets.spreadsheets.values.get({
            spreadsheetId: sheetId,
            range: `${SHEET_NAME}!A2:J`
          });

          const rows = getRes.result.values || [];
          if (rows.length > 0) {
            books = rows.map(r => ({
              id: r[0] || crypto.randomUUID(),
              title: r[1] || 'Sin título',
              type: r[2] || 'Libro',
              author: r[3] || '',
              current: Number(r[4]) || 0,
              total: Math.max(1, Number(r[5]) || 1),
              isSaga: String(r[6]).toLowerCase() === 'true',
              sagaName: r[7] || '',
              sagaOrder: Math.max(1, Number(r[8]) || 1),
              cover: r[9] || ''
            }));
            saveLocalData();
            renderLibrary();
          } else if (books.length > 0) {
            await pushAllToSheets(sheetId);
          }
        } else {
          await pushAllToSheets(sheetId);
        }

        showToast('Sincronizado con Google Sheets', 'success');
      } catch (err) {
        console.error('Error sincronizando con Google Sheets:', err);
        showToast('Error al sincronizar con Google Sheets', 'error');
      } finally {
        syncIcon.classList.remove('animate-spin');
      }
    }

    async function pushAllToSheets(sheetId) {
      const targetId = sheetId || (await findOrCreateSpreadsheet());
      const rows = books.map(b => [
        b.id,
        b.title,
        b.type,
        b.author || '',
        b.current,
        b.total,
        b.isSaga ? 'TRUE' : 'FALSE',
        b.sagaName || '',
        b.sagaOrder || 1,
        b.cover || ''
      ]);

      await gapi.client.sheets.spreadsheets.values.clear({
        spreadsheetId: targetId,
        range: `${SHEET_NAME}!A2:J`
      });

      if (rows.length > 0) {
        await gapi.client.sheets.spreadsheets.values.update({
          spreadsheetId: targetId,
          range: `${SHEET_NAME}!A2:J${rows.length + 1}`,
          valueInputOption: 'RAW',
          resource: { values: rows }
        });
      }
    }

    // =========================================================================
    // UTILIDADES DE PROGRESO, COLOR HSL Y NORMALIZACIÓN DE SAGAS
    // =========================================================================
    function normalizeSagaKey(name) {
      return (name || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function getProgressPercentage(current, total) {
      if (!total || total <= 0) return 0;
      return Math.min(100, Math.max(0, Math.round((current / total) * 100)));
    }

    // Gradiente HSL dinámico: Rojo (0deg) -> Ámbar (45deg) -> Verde Esmeralda (142deg)
    function getProgressHslColor(percent) {
      const hue = Math.round((percent / 100) * 142);
      return `hsl(${hue}, 82%, 48%)`;
    }

    function getUnitLabel(type, plural = true) {
      if (type === 'Manga') return plural ? 'caps' : 'Cap';
      return plural ? 'págs' : 'Pág';
    }

    function getTypeBadgeHtml(type) {
      const styles = {
        'Libro': 'bg-sky-500/15 text-sky-300 border-sky-500/30',
        'Cómic': 'bg-amber-500/15 text-amber-300 border-amber-500/30',
        'Manga': 'bg-fuchsia-500/15 text-fuchsia-300 border-fuchsia-500/30'
      };
      const icons = { 'Libro': '📚', 'Cómic': '💥', 'Manga': '⛩️' };
      const cls = styles[type] || styles['Libro'];
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md border text-[11px] font-semibold ${cls}">${icons[type] || '📖'} ${type}</span>`;
    }

    // =========================================================================
    // FILTROS Y CAMBIO DE MODO DE VISTA
    // =========================================================================
    function setViewMode(mode) {
      viewMode = mode;
      const btnGrouped = document.getElementById('btnViewGrouped');
      const btnIndividual = document.getElementById('btnViewIndividual');

      if (mode === 'grouped') {
        btnGrouped.className = 'flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3 py-2 min-h-[36px] rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow-sm';
        btnIndividual.className = 'flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3 py-2 min-h-[36px] rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200';
      } else {
        btnIndividual.className = 'flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3 py-2 min-h-[36px] rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow-sm';
        btnGrouped.className = 'flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3 py-2 min-h-[36px] rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200';
      }
      renderLibrary();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(btn => {
        const isActive = btn.dataset.filter === filter;
        btn.className = isActive
          ? 'filter-pill shrink-0 px-3.5 py-2 min-h-[38px] rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-sm transition'
          : 'filter-pill shrink-0 px-3.5 py-2 min-h-[38px] rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition';
      });
      renderLibrary();
    }

    function toggleSagaExpand(sagaKey) {
      if (expandedSagas.has(sagaKey)) {
        expandedSagas.delete(sagaKey);
      } else {
        expandedSagas.add(sagaKey);
      }
      saveLocalData();
      renderLibrary();
    }

    // =========================================================================
    // RENDERIZADO PRINCIPAL (AGRUPADO POR SAGAS + VISTA INDIVIDUAL)
    // =========================================================================
    function updateStats() {
      const total = books.length;
      const completed = books.filter(b => b.current >= b.total).length;
      const inProgress = books.filter(b => b.current > 0 && b.current < b.total).length;
      const uniqueSagas = new Set(
        books
          .filter(b => b.isSaga && normalizeSagaKey(b.sagaName))
          .map(b => normalizeSagaKey(b.sagaName))
      );

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statSagas').textContent = uniqueSagas.size;
      document.getElementById('statInProgress').textContent = inProgress;
      document.getElementById('statCompleted').textContent = completed;
    }

    function getFilteredBooks() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();

      return books.filter(book => {
        const isCompleted = book.current >= book.total;
        if (currentFilter === 'Libro' && book.type !== 'Libro') return false;
        if (currentFilter === 'Cómic' && book.type !== 'Cómic') return false;
        if (currentFilter === 'Manga' && book.type !== 'Manga') return false;
        if (currentFilter === 'in_progress' && (isCompleted || book.current === 0)) return false;
        if (currentFilter === 'completed' && !isCompleted) return false;

        if (q) {
          const hay = `${book.title} ${book.author || ''} ${book.sagaName || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function renderLibrary() {
      updateStats();
      const container = document.getElementById('libraryContainer');
      const filtered = getFilteredBooks();

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-8 sm:p-12 text-center space-y-3">
            <div class="w-12 h-12 rounded-2xl bg-slate-800 text-slate-400 flex items-center justify-center mx-auto">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
              </svg>
            </div>
            <h3 class="text-base font-bold text-white">No hay lecturas que coincidan</h3>
            <p class="text-xs sm:text-sm text-slate-400 max-w-md mx-auto">Prueba cambiando los filtros o agrega una nueva lectura a tu biblioteca.</p>
          </div>
        `;
        return;
      }

      if (viewMode === 'individual') {
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3.5 sm:gap-4">
            ${filtered.map(book => renderBookCard(book)).join('')}
          </div>
        `;
        return;
      }

      // MODO AGRUPADO POR SAGAS
      const sagaMap = new Map();
      const standalones = [];

      filtered.forEach(book => {
        const normKey = book.isSaga ? normalizeSagaKey(book.sagaName) : '';
        if (normKey) {
          if (!sagaMap.has(normKey)) {
            sagaMap.set(normKey, {
              key: normKey,
              displayName: book.sagaName.trim(),
              volumes: []
            });
          }
          sagaMap.get(normKey).volumes.push(book);
        } else {
          standalones.push(book);
        }
      });

      let html = '';

      // Sección de Sagas / Series Agrupadas
      if (sagaMap.size > 0) {
        html += `<div class="space-y-4">`;
        sagaMap.forEach(saga => {
          html += renderSagaGroupCard(saga);
        });
        html += `</div>`;
      }

      // Sección de Lecturas Independientes
      if (standalones.length > 0) {
        html += `
          <div class="space-y-3">
            ${sagaMap.size > 0 ? `<h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">Lecturas Independientes (${standalones.length})</h2>` : ''}
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3.5 sm:gap-4">
              ${standalones.map(book => renderBookCard(book)).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderSagaGroupCard(saga) {
      // Ordenar estrictamente por sagaOrder ascendente
      const volumes = [...saga.volumes].sort((a, b) => (a.sagaOrder || 1) - (b.sagaOrder || 1));
      const totalVols = volumes.length;
      const completedVols = volumes.filter(v => v.current >= v.total).length;

      // Progreso global basado en la suma de páginas/capítulos de toda la saga
      const totalUnits = volumes.reduce((acc, v) => acc + (v.total || 0), 0);
      const currentUnits = volumes.reduce((acc, v) => acc + Math.min(v.current || 0, v.total || 0), 0);
      const sagaPercent = getProgressPercentage(currentUnits, totalUnits);
      const barColor = getProgressHslColor(sagaPercent);

      // Siguiente volumen pendiente (menor sagaOrder sin terminar)
      const nextUnread = volumes.find(v => v.current < v.total) || null;
      const isExpanded = expandedSagas.has(saga.key);

      // Tipos únicos dentro de la saga
      const uniqueTypes = [...new Set(volumes.map(v => v.type))];
      const authors = [...new Set(volumes.map(v => v.author).filter(Boolean))];

      return `
        <div class="bg-slate-900/90 border ${isExpanded ? 'border-indigo-500/40' : 'border-slate-800/90'} rounded-2xl overflow-hidden shadow-lg transition animate-card">
          <!-- Cabecera Clickable de la Saga -->
          <div
            onclick="toggleSagaExpand('${escapeHtml(saga.key)}')"
            role="button"
            tabindex="0"
            class="p-4 sm:p-5 cursor-pointer hover:bg-slate-800/40 transition select-none"
          >
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0 flex-1 space-y-1.5">
                <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 text-[11px] font-bold">
                    📚 SAGA
                  </span>
                  ${uniqueTypes.map(t => getTypeBadgeHtml(t)).join('')}
                  <span class="text-xs font-semibold text-slate-300 bg-slate-800/90 px-2.5 py-0.5 rounded-full">
                    ${completedVols} / ${totalVols} tomos completados
                  </span>
                </div>

                <h3 class="text-base sm:text-lg font-extrabold text-white leading-snug break-words">
                  ${escapeHtml(saga.displayName)}
                </h3>

                ${authors.length > 0 ? `<p class="text-xs text-slate-400 truncate">${escapeHtml(authors.join(', '))}</p>` : ''}
              </div>

              <!-- Porcentaje y Chevron -->
              <div class="flex items-center gap-2.5 shrink-0">
                <div class="text-right">
                  <span class="text-sm sm:text-base font-extrabold text-white">${sagaPercent}%</span>
                  <p class="text-[10px] text-slate-400 hidden sm:block">${currentUnits}/${totalUnits}</p>
                </div>
                <div class="w-9 h-9 rounded-xl bg-slate-800/90 border border-slate-700/80 flex items-center justify-center text-slate-300">
                  <svg class="w-5 h-5 saga-chevron ${isExpanded ? 'rotated' : ''}" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                  </svg>
                </div>
              </div>
            </div>

            <!-- Barra de Progreso Global de la Saga -->
            <div class="mt-3.5 space-y-2">
              <div class="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800/80">
                <div class="h-full progress-bar-fill rounded-full" style="width: ${sagaPercent}%; background-color: ${barColor};"></div>
              </div>

              <!-- Badge del Siguiente Tomo Pendiente en Orden -->
              <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5">
                ${nextUnread ? `
                  <div class="inline-flex items-center gap-1.5 text-xs text-amber-300 bg-amber-500/10 border border-amber-500/25 px-2.5 py-1 rounded-lg max-w-full">
                    <span class="font-bold shrink-0">▶ Siguiente (#${nextUnread.sagaOrder || 1}):</span>
                    <span class="truncate font-medium">${escapeHtml(nextUnread.title)}</span>
                  </div>
                ` : `
                  <div class="inline-flex items-center gap-1.5 text-xs text-emerald-300 bg-emerald-500/10 border border-emerald-500/25 px-2.5 py-1 rounded-lg">
                    <span class="font-bold">✨ ¡Saga completada al 100%!</span>
                  </div>
                `}

                <span class="text-[11px] font-medium text-indigo-400">
                  ${isExpanded ? 'Ocultar tomos' : `Ver ${totalVols} ${totalVols === 1 ? 'tomo' : 'tomos'}`}
                </span>
              </div>
            </div>
          </div>

          <!-- Lista Desplegable de Tomos Ordenados -->
          ${isExpanded ? `
            <div class="p-3.5 sm:p-5 pt-2 sm:pt-3 bg-slate-950/60 border-t border-slate-800/80">
              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-4">
                ${volumes.map(vol => {
                  const isNextActive = nextUnread && vol.id === nextUnread.id;
                  const isFutureQueued = nextUnread && vol.current < vol.total && vol.id !== nextUnread.id;
                  return renderBookCard(vol, { isInsideSaga: true, isNextActive, isFutureQueued });
                }).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderBookCard(book, options = {}) {
      const { isInsideSaga = false, isNextActive = false, isFutureQueued = false } = options;
      const percent = getProgressPercentage(book.current, book.total);
      const isCompleted = book.current >= book.total;
      const barColor = getProgressHslColor(percent);
      const unitShort = getUnitLabel(book.type, false);
      const unitPlural = getUnitLabel(book.type, true);

      // Borde destacado para el tomo activo dentro de una saga
      let cardBorderClass = 'border-slate-800/90';
      if (isNextActive) {
        cardBorderClass = 'border-amber-500/60 ring-1 ring-amber-500/25';
      } else if (isCompleted) {
        cardBorderClass = 'border-emerald-500/30';
      }

      const fallbackCover = `https://placehold.co/136x200/1e293b/94a3b8?text=${encodeURIComponent(book.type)}`;
      const coverUrl = book.cover && book.cover.trim() ? book.cover.trim() : fallbackCover;

      return `
        <article class="bg-slate-900 border ${cardBorderClass} rounded-2xl p-3.5 sm:p-4 flex flex-col justify-between gap-3.5 shadow-md hover:border-slate-700 transition animate-card">
          <!-- Parte Superior: Miniatura Responsiva + Metadatos -->
          <div class="flex gap-3 sm:gap-3.5">
            <!-- Miniatura Compacta (68x100 en móvil) -->
            <div class="relative w-[68px] h-[100px] sm:w-[76px] sm:h-[112px] rounded-xl overflow-hidden bg-slate-800 border border-slate-700/70 shrink-0">
              <img
                src="${escapeHtml(coverUrl)}"
                alt="${escapeHtml(book.title)}"
                onerror="this.onerror=null;this.src='${fallbackCover}';"
                class="w-full h-full object-cover"
                loading="lazy"
              />
              ${book.isSaga ? `
                <span class="absolute top-1 left-1 px-1.5 py-0.5 rounded-md bg-slate-950/85 backdrop-blur text-[10px] font-extrabold text-indigo-300 border border-indigo-500/30">
                  #${book.sagaOrder || 1}
                </span>
              ` : ''}
            </div>

            <!-- Información Principal -->
            <div class="min-w-0 flex-1 flex flex-col justify-between">
              <div class="space-y-1">
                <div class="flex flex-wrap items-center gap-1.5">
                  ${getTypeBadgeHtml(book.type)}
                  ${isNextActive ? `<span class="px-2 py-0.5 rounded-md bg-amber-500/20 border border-amber-500/40 text-amber-300 text-[10px] font-bold">▶ En turno</span>` : ''}
                  ${isFutureQueued ? `<span class="px-2 py-0.5 rounded-md bg-slate-800 border border-slate-700 text-slate-400 text-[10px] font-medium">Siguiente en la cola</span>` : ''}
                </div>

                <h4 class="text-sm sm:text-base font-bold text-white leading-snug line-clamp-2 break-words">
                  ${escapeHtml(book.title)}
                </h4>

                ${book.author ? `<p class="text-xs text-slate-400 truncate">${escapeHtml(book.author)}</p>` : ''}

                ${!isInsideSaga && book.isSaga && book.sagaName ? `
                  <p class="text-[11px] font-semibold text-indigo-400 truncate">
                    📚 ${escapeHtml(book.sagaName)} • Tomo #${book.sagaOrder || 1}
                  </p>
                ` : ''}
              </div>

              <!-- Texto de Progreso -->
              <div class="flex items-center justify-between text-xs pt-1.5">
                <span class="font-semibold text-slate-300">
                  ${book.current} / ${book.total} ${unitPlural}
                </span>
                <span class="font-extrabold" style="color: ${barColor};">${percent}%</span>
              </div>
            </div>
          </div>

          <!-- Barra de Progreso Ancho Completo -->
          <div class="w-full h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-800/80">
            <div class="h-full progress-bar-fill rounded-full" style="width: ${percent}%; background-color: ${barColor};"></div>
          </div>

          <!-- Botones de Acción Táctiles (min-height 40px+) -->
          <div class="flex items-center justify-between gap-2 pt-0.5">
            <button
              onclick="incrementProgress('${book.id}', 1)"
              ${isCompleted ? 'disabled' : ''}
              class="flex-1 inline-flex items-center justify-center gap-1 px-3 py-2 min-h-[42px] rounded-xl text-xs font-bold transition ${
                isCompleted
                  ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 cursor-default'
                  : 'bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white shadow-sm'
              }"
            >
              ${isCompleted ? '✅ Completado' : `+1 ${unitShort}`}
            </button>

            <div class="flex items-center gap-1.5 shrink-0">
              <button
                onclick="openBookModal('${book.id}')"
                title="Editar"
                aria-label="Editar lectura"
                class="w-10 h-[42px] rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700/80 text-slate-300 hover:text-white flex items-center justify-center transition"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z" />
                </svg>
              </button>

              <button
                onclick="openDeleteModal('${book.id}')"
                title="Eliminar"
                aria-label="Eliminar lectura"
                class="w-10 h-[42px] rounded-xl bg-slate-800 hover:bg-rose-950/70 border border-slate-700/80 hover:border-rose-800/70 text-slate-400 hover:text-rose-300 flex items-center justify-center transition"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                </svg>
              </button>
            </div>
          </div>
        </article>
      `;
    }

    // =========================================================================
    // ACCIONES CRUD Y PROGRESO
    // =========================================================================
    async function incrementProgress(id, step) {
      const idx = books.findIndex(b => b.id === id);
      if (idx === -1) return;

      const book = books[idx];
      if (book.current >= book.total) return;

      book.current = Math.min(book.total, book.current + step);
      saveLocalData();
      renderLibrary();

      if (book.current === book.total) {
        showToast(`🎉 ¡Completaste "${book.title}"!`, 'success');
      }

      if (accessToken) {
        await pushAllToSheets();
      }
    }

    function openBookModal(editId = null) {
      const modal = document.getElementById('bookModal');
      const form = document.getElementById('bookForm');
      form.reset();

      // Rellenar sugerencias de sagas existentes
      const datalist = document.getElementById('existingSagasList');
      const uniqueSagaNames = [...new Set(books.filter(b => b.isSaga && b.sagaName).map(b => b.sagaName.trim()))];
      datalist.innerHTML = uniqueSagaNames.map(name => `<option value="${escapeHtml(name)}"></option>`).join('');

      if (editId) {
        const book = books.find(b => b.id === editId);
        if (!book) return;
        document.getElementById('modalTitle').textContent = 'Editar Lectura';
        document.getElementById('bookId').value = book.id;
        document.getElementById('bookTitle').value = book.title;
        document.getElementById('bookType').value = book.type;
        document.getElementById('bookAuthor').value = book.author || '';
        document.getElementById('bookCurrent').value = book.current;
        document.getElementById('bookTotal').value = book.total;
        document.getElementById('bookIsSaga').checked = Boolean(book.isSaga);
        document.getElementById('bookSagaName').value = book.sagaName || '';
        document.getElementById('bookSagaOrder').value = book.sagaOrder || 1;
        document.getElementById('bookCover').value = book.cover || '';
      } else {
        document.getElementById('modalTitle').textContent = 'Nueva Lectura';
        document.getElementById('bookId').value = '';
        document.getElementById('bookIsSaga').checked = false;
        document.getElementById('bookSagaOrder').value = 1;
      }

      updateUnitLabels();
      toggleSagaFields();

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeBookModal() {
      const modal = document.getElementById('bookModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function updateUnitLabels() {
      const type = document.getElementById('bookType').value;
      const isManga = type === 'Manga';
      document.getElementById('labelCurrentUnit').textContent = isManga ? 'Capítulos leídos' : 'Páginas leídas';
      document.getElementById('labelTotalUnit').textContent = isManga ? 'Total de capítulos *' : 'Total de páginas *';
    }

    function toggleSagaFields() {
      const isSaga = document.getElementById('bookIsSaga').checked;
      const container = document.getElementById('sagaFieldsContainer');
      const sagaNameInput = document.getElementById('bookSagaName');

      if (isSaga) {
        container.classList.remove('hidden');
        container.classList.add('grid');
        sagaNameInput.required = true;
      } else {
        container.classList.add('hidden');
        container.classList.remove('grid');
        sagaNameInput.required = false;
      }
    }

    async function saveBook(event) {
      event.preventDefault();

      const id = document.getElementById('bookId').value;
      const title = document.getElementById('bookTitle').value.trim();
      const type = document.getElementById('bookType').value;
      const author = document.getElementById('bookAuthor').value.trim();
      const total = Math.max(1, parseInt(document.getElementById('bookTotal').value, 10) || 1);
      const current = Math.min(total, Math.max(0, parseInt(document.getElementById('bookCurrent').value, 10) || 0));
      const isSaga = document.getElementById('bookIsSaga').checked;
      const sagaName = isSaga ? document.getElementById('bookSagaName').value.trim() : '';
      const sagaOrder = isSaga ? Math.max(1, parseInt(document.getElementById('bookSagaOrder').value, 10) || 1) : 1;
      const cover = document.getElementById('bookCover').value.trim();

      const payload = {
        id: id || crypto.randomUUID(),
        title,
        type,
        author,
        current,
        total,
        isSaga: isSaga && Boolean(sagaName),
        sagaName,
        sagaOrder,
        cover
      };

      if (id) {
        const idx = books.findIndex(b => b.id === id);
        if (idx !== -1) books[idx] = payload;
      } else {
        books.unshift(payload);
      }

      if (payload.isSaga && payload.sagaName) {
        expandedSagas.add(normalizeSagaKey(payload.sagaName));
      }

      saveLocalData();
      closeBookModal();
      renderLibrary();
      showToast(id ? 'Lectura actualizada' : 'Lectura agregada a tu biblioteca', 'success');

      if (accessToken) {
        await pushAllToSheets();
      }
    }

    function openDeleteModal(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;
      bookIdToDelete = id;
      document.getElementById('deleteModalText').textContent = `Se eliminará "${book.title}" de tu lista de lecturas.`;
      const modal = document.getElementById('deleteModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      document.getElementById('confirmDeleteBtn').onclick = async () => {
        books = books.filter(b => b.id !== bookIdToDelete);
        saveLocalData();
        closeDeleteModal();
        renderLibrary();
        showToast('Lectura eliminada', 'info');
        if (accessToken) {
          await pushAllToSheets();
        }
      };
    }

    function closeDeleteModal() {
      const modal = document.getElementById('deleteModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      bookIdToDelete = null;
    }

    // =========================================================================
    // LECTURA DEL DÍA (SOLO INDEPENDIENTES PENDIENTES O PRIMER TOMO PENDIENTE DE SAGA)
    // =========================================================================
    function pickDailyRead() {
      const candidates = [];
      const sagaFirstUnreadMap = new Map();

      books.forEach(book => {
        if (book.current >= book.total) return; // Ignorar completados

        const normKey = book.isSaga ? normalizeSagaKey(book.sagaName) : '';
        if (normKey) {
          const existing = sagaFirstUnreadMap.get(normKey);
          if (!existing || (book.sagaOrder || 1) < (existing.sagaOrder || 1)) {
            sagaFirstUnreadMap.set(normKey, book);
          }
        } else {
          candidates.push(book);
        }
      });

      sagaFirstUnreadMap.forEach(vol => candidates.push(vol));

      if (candidates.length === 0) {
        showToast('¡Felicidades! No tienes lecturas pendientes por ahora.', 'success');
        return;
      }

      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      const percent = getProgressPercentage(chosen.current, chosen.total);
      const unitPlural = getUnitLabel(chosen.type, true);

      document.getElementById('dailyBookTitle').textContent = chosen.title;
      document.getElementById('dailyBookSubtitle').textContent = chosen.isSaga && chosen.sagaName
        ? `${chosen.sagaName} (Tomo #${chosen.sagaOrder || 1})${chosen.author ? ' • ' + chosen.author : ''}`
        : `${chosen.type}${chosen.author ? ' • ' + chosen.author : ''}`;

      document.getElementById('dailyBookProgressBox').innerHTML = `
        Progreso actual: <strong class="text-white">${chosen.current} / ${chosen.total} ${unitPlural}</strong> (${percent}%)
      `;

      const modal = document.getElementById('dailyModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeDailyModal() {
      const modal = document.getElementById('dailyModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // =========================================================================
    // UTILIDADES UI (TOASTS Y ESCAPE HTML)
    // =========================================================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const colors = {
        success: 'bg-emerald-950/95 border-emerald-500/40 text-emerald-200',
        error: 'bg-rose-950/95 border-rose-500/40 text-rose-200',
        info: 'bg-slate-900/95 border-slate-700 text-slate-200'
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border text-xs sm:text-sm font-medium shadow-xl backdrop-blur-md transition-all duration-300 ${colors[type] || colors.info}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
